<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
/>

<title>MoneyTracker</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#181420;
color:white;
padding:25px;
}

.container{
background:#221b2f;
border:2px solid #c084fc;
border-radius:20px;
padding:25px;
box-shadow:0 0 25px rgba(192,132,252,0.25);
}

.top-section{
display:flex;
justify-content:space-between;
flex-wrap:wrap;
gap:20px;
margin-bottom:30px;
}

.title{
font-size:60px;
font-weight:bold;
color:#d8b4fe;
outline:none;
}

.salary-box{
background:#2b213d;
border:1px solid #c084fc;
border-radius:15px;
padding:20px;
min-width:350px;
}

.salary-row{
display:flex;
justify-content:space-between;
margin-bottom:15px;
}

.salary-row input{
width:180px;
padding:10px;
border:none;
border-radius:10px;
background:#1b1427;
color:white;
}

.button-group{
display:flex;
flex-wrap:wrap;
gap:10px;
margin-bottom:20px;
}

.add-btn{
background:#a855f7;
color:white;
border:none;
padding:12px 20px;
border-radius:10px;
cursor:pointer;
font-weight:bold;
}

.delete-btn{
background:#ef4444;
color:white;
border:none;
padding:10px 15px;
border-radius:10px;
cursor:pointer;
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#312344;
color:#f3e8ff;
border:1px solid #4c3566;
padding:15px;
}

td{
border:1px solid #4c3566;
padding:12px;
}

.table-input,
.price-input{
width:100%;
background:transparent;
border:none;
color:white;
outline:none;
}

.status-select{
width:100%;
padding:10px;
border:none;
border-radius:10px;
color:white;
font-weight:bold;
}

.paid{
background:#22c55e;
}

.unpaid{
background:#ef4444;
}

.summary{
margin-top:30px;
margin-left:auto;
width:400px;
background:#2b213d;
border:1px solid #c084fc;
border-radius:15px;
padding:20px;
}

.summary-row{
display:flex;
justify-content:space-between;
margin-bottom:20px;
font-size:24px;
font-weight:bold;
}

.breakdown-box{
margin-top:30px;
background:#2b213d;
border:1px solid #c084fc;
border-radius:18px;
padding:20px;
}

.breakdown-title{
font-size:28px;
margin-bottom:20px;
}

.breakdown-price,
.breakdown-name,
.breakdownMainTotal{
width:100%;
padding:10px;
border:none;
border-radius:10px;
background:#1b1427;
color:white;
}

.loan-box{
margin-top:30px;
background:#2b213d;
border:1px solid #c084fc;
border-radius:18px;
padding:20px;
}

.loan-title{
font-size:28px;
margin-bottom:18px;
color:#f3e8ff;
}

.loan-field-label{
display:block;
font-size:13px;
font-weight:bold;
letter-spacing:.5px;
color:#d8b4fe;
margin:12px 0 7px;
}

.loan-amount,
.loan-bank{
width:100%;
padding:12px;
border:1px solid #4c3566;
border-radius:10px;
background:#1b1427;
color:white;
outline:none;
font-size:16px;
}

.loan-bank-name{
font-size:24px;
font-weight:bold;
margin-top:22px;
color:#d8b4fe;
}

.loan-rate-note{
margin:7px 0 15px;
font-size:13px;
color:#c4b5fd;
opacity:.9;
}

.loan-results-table{
margin-top:10px;
}

.loan-results-table th,
.loan-results-table td{
text-align:right;
}

.loan-results-table th:first-child,
.loan-results-table td:first-child{
text-align:left;
}

.loan-empty{
padding:18px 12px;
text-align:center;
opacity:.7;
}

.loan-actions{
display:flex;
gap:10px;
margin-top:15px;
flex-wrap:wrap;
}

@media (max-width:700px){
body{padding:12px;}
.container{padding:15px;}
.title{font-size:42px;}
.salary-box{min-width:100%;}
.summary{width:100%;}
.loan-results-table{font-size:13px;}
.loan-results-table th,
.loan-results-table td{padding:9px 6px;}
}

</style>

</head>

<script>

// MoneyTracker build: Leif-only loan calculator (RCBC UnliPay / UB EasyCash)

const SUPABASE_URL =
"https://fvzrphhacxchvicekluj.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_6i0q8k_jhf2yPKgqB1yNrA_cq4ER4Wt";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
);

let currentMonth =
localStorage.getItem("currentMonth")
|| "April-2026";

let isLoading = false;
let currentUser = null;
let currentUsername = "";

const RCBC_LOAN_TERMS = [3, 6, 9, 12, 18, 24, 36];
const RCBC_ADD_ON_RATE = 0.01;
const UB_LOAN_TERMS = [6, 12];
const UB_ADD_ON_RATE = 0.0049;
const UB_PROCESSING_FEE = 1000;

function isLeifUser(){
return String(currentUsername || "").trim().toLowerCase() === "leif";
}

function updateLeifOnlyUI(){
const button = document.getElementById("addLoanBtn");
if(button){
button.style.display = isLeifUser() ? "inline-block" : "none";
}

if(!isLeifUser()){
const loanContainer = document.getElementById("allLoans");
if(loanContainer) loanContainer.innerHTML = "";
}
}

function formatPeso(value){
return Number(value || 0).toLocaleString("en-PH", {
minimumFractionDigits: 2,
maximumFractionDigits: 2
});
}

function getRCBCProcessingFee(amount){
if(amount < 10000) return 100;
if(amount < 30000) return 200;
return amount * 0.01;
}

function getLoanOptions(bank, amount){
if(!amount || amount <= 0) return [];

if(bank === "UB"){
return UB_LOAN_TERMS.map(term => {
const monthly = (amount / term) + (amount * UB_ADD_ON_RATE);
const installmentTotal = monthly * term;
return {
term,
monthly,
fee: UB_PROCESSING_FEE,
total: installmentTotal + UB_PROCESSING_FEE
};
});
}

return RCBC_LOAN_TERMS.map(term => {
if(term === 3){
const fee = getRCBCProcessingFee(amount);
return {
term,
monthly: amount / 3,
fee,
total: amount + fee
};
}

const monthly = (amount / term) + (amount * RCBC_ADD_ON_RATE);
return {
term,
monthly,
fee: 0,
total: monthly * term
};
});
}

function updateLoanBox(box){
if(!box || !isLeifUser()) return;

const amount = Number(box.querySelector(".loan-amount")?.value) || 0;
const bank = box.querySelector(".loan-bank")?.value || "RCBC";
const bankName = box.querySelector(".loan-bank-name");
const note = box.querySelector(".loan-rate-note");
const results = box.querySelector(".loan-results");

if(bankName){
bankName.innerText = bank === "UB" ? "UB EasyCash" : "RCBC UnliPay";
}

if(note){
note.innerText = bank === "UB"
? "0.49% monthly add-on • ₱1,000 processing fee billed separately"
: "3 months: 0% installment interest + processing fee • 6–36 months: 1% monthly add-on";
}

if(!results) return;

if(amount <= 0){
results.innerHTML = `
<tr>
<td colspan="4" class="loan-empty">Enter an amount above to see the installment options.</td>
</tr>
`;
return;
}

const options = getLoanOptions(bank, amount);
results.innerHTML = options.map(option => `
<tr>
<td>${option.term} MOS</td>
<td>₱${formatPeso(option.monthly)}</td>
<td>₱${formatPeso(option.total)}</td>
<td>${option.fee ? `₱${formatPeso(option.fee)}` : "—"}</td>
</tr>
`).join("");
}

function addLoanBox(savedLoan = null){
if(!isLeifUser()) return;

const container = document.getElementById("allLoans");
if(!container) return;

const box = document.createElement("div");
box.className = "loan-box";
box.innerHTML = `
<h2 class="loan-title">LOAN CALCULATOR</h2>

<label class="loan-field-label">AMOUNT</label>
<input
class="loan-amount"
type="number"
min="0"
step="0.01"
placeholder="Enter amount"
oninput="updateLoanBox(this.closest('.loan-box')); saveData();"
>

<label class="loan-field-label">BANK</label>
<select
class="loan-bank"
onchange="updateLoanBox(this.closest('.loan-box')); saveData();"
>
<option value="RCBC">RCBC UnliPay</option>
<option value="UB">UB EasyCash</option>
</select>

<div class="loan-bank-name">RCBC UnliPay</div>
<div class="loan-rate-note"></div>

<table class="loan-results-table">
<thead>
<tr>
<th>TERM</th>
<th>MONTHLY</th>
<th>TOTAL</th>
<th>FEE</th>
</tr>
</thead>
<tbody class="loan-results"></tbody>
</table>

<div class="loan-actions">
<button class="delete-btn" onclick="deleteLoanBox(this)">DELETE LOAN</button>
</div>
`;

container.appendChild(box);

if(savedLoan){
box.querySelector(".loan-amount").value = savedLoan.amount ?? "";
box.querySelector(".loan-bank").value = savedLoan.bank === "UB" ? "UB" : "RCBC";
}

updateLoanBox(box);

if(!isLoading){
saveData();
}
}

function deleteLoanBox(button){
if(!isLeifUser()) return;
button.closest(".loan-box")?.remove();
saveData();
}

function userStorageKey(){
return `billTrackerData_${currentUsername}_${currentMonth}`;
}

function setLoginMessage(message){
const el = document.getElementById("loginMessage");
if(el) el.innerText = message || "";
}

async function loginWithUsername(){

const input =
document.getElementById("usernameInput");

const username =
input.value.trim();

if(!username){
setLoginMessage("Please enter a username.");
return;
}

const normalizedUsername =
username.toLowerCase().replace(/\\s+/g," ");

setLoginMessage("Loading...");

try{

let { data: user, error } =
await supabaseClient
.from("money_users")
.select("*")
.eq("username", normalizedUsername)
.maybeSingle();

if(error){
console.log(error);
setLoginMessage(
"Database is not ready. Please run the MoneyTracker SQL setup first."
);
return;
}

if(!user){

const result =
await supabaseClient
.from("money_users")
.insert([{
username: normalizedUsername,
display_name: username
}])
.select()
.single();

if(result.error){
console.log(result.error);
setLoginMessage(
"Could not create this username."
);
return;
}

user = result.data;
}

currentUser = user;
currentUsername = user.username;

if(user.last_month){
currentMonth = user.last_month;
}

document.getElementById("currentUserLabel").innerText =
`User: ${user.display_name || user.username}`;

sessionStorage.setItem(
"moneyTrackerUserId",
user.id
);

sessionStorage.setItem(
"moneyTrackerUsername",
user.username
);

document.getElementById(
"loginScreen"
).style.display = "none";

updateLeifOnlyUI();

generateYearMonths();
await loadData();
calculateTotals();
calculateAllBreakdowns();

if(document.getElementById("billTable").children.length === 0){
addRow();
}

}catch(error){

console.log(error);
setLoginMessage("Login failed. Please try again.");

}

}

function logout(){

sessionStorage.removeItem("moneyTrackerUserId");
sessionStorage.removeItem("moneyTrackerUsername");

currentUser = null;
currentUsername = "";

updateLeifOnlyUI();
document.getElementById("billTable").innerHTML = "";
document.getElementById("allBreakdowns").innerHTML = "";
document.getElementById("allLoans").innerHTML = "";
document.getElementById("salary").value = "";
document.getElementById("leftover").value = "";
document.querySelector(".title").innerText = "BILLS";
document.getElementById("currentUserLabel").innerText = "";
calculateTotals();

document.getElementById("loginScreen").style.display = "flex";
document.getElementById("usernameInput").value = "";
setLoginMessage("");

}

async function checkLoginState(){

const userId =
sessionStorage.getItem("moneyTrackerUserId");

const username =
sessionStorage.getItem("moneyTrackerUsername");

if(!userId || !username) return false;

const { data: user, error } =
await supabaseClient
.from("money_users")
.select("*")
.eq("id", userId)
.eq("username", username)
.maybeSingle();

if(error || !user) return false;

currentUser = user;
currentUsername = user.username;

if(user.last_month){
currentMonth = user.last_month;
}

document.getElementById(
"loginScreen"
).style.display = "none";

document.getElementById("currentUserLabel").innerText =
`User: ${user.display_name || user.username}`;

updateLeifOnlyUI();

return true;
}

function generateYearMonths(){

const select =
document.getElementById(
"monthSelect"
);

select.innerHTML = "";

const months = [

"January",
"February",
"March",
"April",
"May",
"June",
"July",
"August",
"September",
"October",
"November",
"December"

];

const startYear = 2026;
const endYear = 2035;

for(
let year = startYear;
year <= endYear;
year++
){

months.forEach(month => {

if(year === 2026 &&
(month === "January" ||
month === "February" ||
month === "March")) return;

const value =
`${month}-${year}`;

const option =
document.createElement(
"option"
);

option.value = value;

option.textContent = value;

if(value === currentMonth){

option.selected = true;

}

select.appendChild(option);

});

}

}
function previousMonth(){

const select =
document.getElementById(
"monthSelect"
);

if(select.selectedIndex > 0){

select.selectedIndex--;

switchMonth();

}

}

function nextMonth(){

const select =
document.getElementById(
"monthSelect"
);

if(
select.selectedIndex <
select.options.length - 1
){

select.selectedIndex++;

switchMonth();

}

}


async function switchMonth(){

currentMonth =
document.getElementById(
"monthSelect"
).value;

localStorage.setItem(
"currentMonth",
currentMonth
);

if(currentUsername){
localStorage.setItem(
`currentMonth_${currentUsername}`,
currentMonth
);
}

if(currentUser){
await supabaseClient
.from("money_users")
.update({ last_month: currentMonth })
.eq("id", currentUser.id);
}

document.getElementById("billTable").innerHTML = "";
document.getElementById("allBreakdowns").innerHTML = "";
document.getElementById("allLoans").innerHTML = "";

if(currentUser){

await loadData();

}

calculateTotals();
calculateAllBreakdowns();

if(
document.getElementById("billTable").children.length === 0
){

addRow();

}

}

async function getMonthData(month){

const { data, error } =
await supabaseClient
.from("money_data")
.select("data")
.eq("user_id", currentUser.id)
.eq("month", month)
.maybeSingle();

if(error){
console.log(error);
alert("Database error while loading " + month + ".");
return null;
}

if(!data){
alert(`No saved data found for ${month}.`);
return null;
}

return typeof data.data === "string"
? JSON.parse(data.data)
: data.data;
}

async function copyBill(button){

if(!currentUser) return;

const row = button.closest("tr");
const inputs = row.querySelectorAll("input");
const billName = inputs[0]?.value?.trim() || "";

if(!billName){
alert("Give this bill a name first, then copy it.");
return;
}

const sourceMonth = prompt(
`Copy "${billName}" from which month?\\nExample: July-2026`
);

if(!sourceMonth) return;

const cleanMonth = sourceMonth.trim();

if(cleanMonth === currentMonth){
alert("You cannot copy from the current month.");
return;
}

const sourceData = await getMonthData(cleanMonth);
if(!sourceData) return;

const sourceBill = (sourceData.bills || []).find(bill =>
String(bill.billName || "").trim().toLowerCase() === billName.toLowerCase()
);

if(!sourceBill){
alert(`No bill named "${billName}" was found in ${cleanMonth}.`);
return;
}

inputs[0].value = sourceBill.billName || "";
inputs[1].value = sourceBill.price || "";
inputs[2].value = sourceBill.dueDate || "";

const select = row.querySelector("select");
select.value = "Unpaid";
updateStatusVisualOnly(select);

calculateTotals();
await saveData();

}

function updateStatusVisualOnly(select){

if(select.value === "Paid"){
select.classList.remove("unpaid");
select.classList.add("paid");
}else{
select.classList.remove("paid");
select.classList.add("unpaid");
}

}

async function copyBreakdown(button){

if(!currentUser) return;

const box = button.closest(".breakdown-box");
const title =
box.querySelector(".breakdown-title")?.innerText?.trim()
|| "NEW BREAKDOWN";

const sourceMonth = prompt(
`Copy "${title}" from which month?\\nExample: July-2026`
);

if(!sourceMonth) return;

const cleanMonth = sourceMonth.trim();

if(cleanMonth === currentMonth){
alert("You cannot copy from the current month.");
return;
}

const sourceData = await getMonthData(cleanMonth);
if(!sourceData) return;

const sourceBreakdown = (sourceData.breakdowns || []).find(breakdown =>
String(breakdown.title || "").trim().toLowerCase() === title.toLowerCase()
);

if(!sourceBreakdown){
alert(`No breakdown named "${title}" was found in ${cleanMonth}.`);
return;
}

const container = document.getElementById("allBreakdowns");
const newBox = document.createElement("div");
newBox.className = "breakdown-box";

newBox.innerHTML = `
<h2
class="breakdown-title"
contenteditable="true"
onkeyup="saveData()"
>${escapeHtml(sourceBreakdown.title || "NEW BREAKDOWN")}</h2>

<input
type="number"
class="breakdownMainTotal"
placeholder="Main Total"
oninput="
calculateAllBreakdowns();
saveData();
"
>

<table>
<tbody class="breakdownTable"></tbody>
</table>

<div
style="
display:flex;
gap:10px;
margin-top:15px;
"
>

<button
class="add-btn"
onclick="addBreakdownRow(this)"
>
+ ADD ITEM
</button>

<button
class="add-btn"
onclick="copyBreakdown(this)"
title="Copy this breakdown from another month"
>
📋 COPY
</button>

<button
class="delete-btn"
onclick="deleteBreakdownBox(this)"
>
DELETE BOX
</button>

</div>

<div
class="breakdown-summary"
style="margin-top:20px;"
>

<div
style="
display:flex;
justify-content:space-between;
margin-bottom:10px;
font-size:22px;
font-weight:bold;
"
>
<span>NEW TOTAL</span>
<span class="breakdownTotal">0</span>
</div>

function escapeHtml(value){
return String(value)
.replace(/&/g, "&amp;")
.replace(/</g, "&lt;")
.replace(/>/g, "&gt;")
.replace(/"/g, "&quot;")
.replace(/'/g, "&#039;");
}

async function performSelectiveImport(){

const sourceMonth =
document.getElementById("importSourceMonth").value;

const sourceData =
await getMonthData(sourceMonth);

if(!sourceData) return;

const billIndexes =
Array.from(document.querySelectorAll(".import-bill:checked"))
.map(input => Number(input.value));

const billFields =
Array.from(document.querySelectorAll(".import-bill-field:checked"))
.map(input => input.value);

const breakdownIndexes =
Array.from(document.querySelectorAll(".import-breakdown:checked"))
.map(input => Number(input.value));

const breakdownFields =
Array.from(document.querySelectorAll(".import-breakdown-field:checked"))
.map(input => input.value);

if(
billIndexes.length === 0 &&
breakdownIndexes.length === 0
){
alert("Select at least one bill or breakdown.");
return;
}

if(
billIndexes.length > 0 &&
billFields.length === 0
){
alert("Select at least one bill field.");
return;
}

if(
breakdownIndexes.length > 0 &&
breakdownFields.length === 0
){
alert("Select at least one breakdown field.");
return;
}

try{

isLoading = true;

const { data: existingRow, error } =
await supabaseClient
.from("money_data")
.select("data")
.eq("user_id", currentUser.id)
.eq("month", currentMonth)
.maybeSingle();

if(error){
console.log(error);
alert("Database error while loading the current month.");
return;
}

let currentData = existingRow
? (typeof existingRow.data === "string"
? JSON.parse(existingRow.data)
: existingRow.data)
: {
title: currentMonth,
salary: "",
leftover: "",
bills: [],
breakdowns: []
};

currentData.bills =
Array.isArray(currentData.bills)
? currentData.bills
: [];

currentData.breakdowns =
Array.isArray(currentData.breakdowns)
? currentData.breakdowns
: [];

const sourceBills =
Array.isArray(sourceData.bills)
? sourceData.bills
: [];

const sourceBreakdowns =
Array.isArray(sourceData.breakdowns)
? sourceData.breakdowns
: [];

/* BILLS */
billIndexes.forEach(index => {

const sourceBill = sourceBills[index];
if(!sourceBill) return;

const sourceName =
String(sourceBill.billName || "").trim();

let targetBill =
currentData.bills.find(bill =>
String(bill.billName || "").trim().toLowerCase()
=== sourceName.toLowerCase()
);

if(!targetBill){

targetBill = {
billName: sourceBill.billName || "",
price: "",
status: "Unpaid",
dueDate: ""
};

currentData.bills.push(targetBill);

}

if(billFields.includes("billName"))
targetBill.billName = sourceBill.billName || "";

if(billFields.includes("price"))
targetBill.price = sourceBill.price || "";

if(billFields.includes("status"))
targetBill.status = sourceBill.status || "Unpaid";

if(billFields.includes("dueDate"))
targetBill.dueDate = sourceBill.dueDate || "";

});

/* BREAKDOWNS */
breakdownIndexes.forEach(index => {

const sourceBreakdown = sourceBreakdowns[index];
if(!sourceBreakdown) return;

const sourceTitle =
String(sourceBreakdown.title || "").trim();

let targetBreakdown =
currentData.breakdowns.find(breakdown =>
String(breakdown.title || "").trim().toLowerCase()
=== sourceTitle.toLowerCase()
);

if(!targetBreakdown){

targetBreakdown = {
title: sourceBreakdown.title || "NEW BREAKDOWN",
total: "",
items: []
};

currentData.breakdowns.push(targetBreakdown);

}

if(breakdownFields.includes("title"))
targetBreakdown.title =
sourceBreakdown.title || "NEW BREAKDOWN";

if(breakdownFields.includes("total"))
targetBreakdown.total =
sourceBreakdown.total || "";

/*
For breakdown items, match by description when possible.
If no match exists, create a new item.
This allows importing only price or only description without
destroying existing items.
*/
const sourceItems =
Array.isArray(sourceBreakdown.items)
? sourceBreakdown.items
: [];

targetBreakdown.items =
Array.isArray(targetBreakdown.items)
? targetBreakdown.items
: [];

sourceItems.forEach((sourceItem, itemIndex) => {

const sourceDescription =
String(sourceItem.description || "").trim();

let targetItem =
targetBreakdown.items.find(item =>
sourceDescription &&
String(item.description || "").trim().toLowerCase()
=== sourceDescription.toLowerCase()
);

if(!targetItem){
targetItem =
targetBreakdown.items[itemIndex];
}

if(!targetItem){

targetItem = {
price: "",
description: ""
};

targetBreakdown.items.push(targetItem);

}

if(breakdownFields.includes("itemPrice"))
targetItem.price = sourceItem.price || "";

if(breakdownFields.includes("description"))
targetItem.description =
sourceItem.description || "";

});

});

/* Save the merged current month without changing salary/leftover/title. */
const { error: saveError } =
await supabaseClient
.from("money_data")
.upsert([
{
user_id: currentUser.id,
month: currentMonth,
data: currentData
}
],
{ onConflict: "user_id,month" });

if(saveError){
console.log(saveError);
alert("Import could not be saved.");
return;
}

localStorage.setItem(
userStorageKey(),
JSON.stringify(currentData)
);

closeImportModal();

await loadData();
calculateTotals();
calculateAllBreakdowns();

if(document.getElementById("billTable").children.length === 0){
addRow();
}

alert(`Selected information imported from ${sourceMonth}.`);

}catch(error){

console.log(error);
alert("Import failed.");

}finally{

isLoading = false;

}

}

function calculateTotals(){

let totalBill = 0;

document.querySelectorAll(".price-input")
.forEach(input => {

totalBill +=
Number(input.value) || 0;

});

const salary =
Number(
document.getElementById("salary").value
) || 0;

const leftover =
Number(
document.getElementById("leftover").value
) || 0;

const totalMoney =
salary + leftover;

const moneyLeft =
totalMoney - totalBill;

document.getElementById(
"totalBill"
).innerText =
totalBill.toLocaleString();

document.getElementById(
"totalMoney"
).innerText =
totalMoney.toLocaleString();

document.getElementById(
"moneyLeft"
).innerText =
moneyLeft.toLocaleString();

}

function calculateAllBreakdowns(){

const boxes =
document.querySelectorAll(
".breakdown-box"
);

boxes.forEach(box => {

let total = 0;

box.querySelectorAll(
".breakdown-price"
).forEach(input => {

total +=
Number(input.value) || 0;

});

const mainTotal =
Number(
box.querySelector(
".breakdownMainTotal"
).value
) || 0;

box.querySelector(
".breakdownTotal"
).innerText =
total.toLocaleString();

box.querySelector(
".actualBreakdownBill"
).innerText =
(
mainTotal - total
).toLocaleString();

});

}

document.getElementById("leftover").value = "";
document.getElementById("billTable").innerHTML = "";
document.getElementById("allBreakdowns").innerHTML = "";
document.getElementById("allLoans").innerHTML = "";

localStorage.getItem(userStorageKey());

try{

const { data: cloudData, error } =
await supabaseClient
.from("money_data")
.select("*")
.eq("user_id", currentUser.id)
.eq("month", currentMonth)
.maybeSingle();

if(error){
console.log(error);
}

if(cloudData?.data){

saved = cloudData.data;

userStorageKey(),
saved
);

"leftover"

"billTable"
).innerHTML = "";

document.querySelectorAll(

);

rows[rows.length - 1];

lastRow.querySelectorAll("input");

bill.dueDate || "";

lastRow.querySelector("select");
