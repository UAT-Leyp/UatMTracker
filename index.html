<script>

const SUPABASE_URL =
"https://fvzrphhacxchvicekluj.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_6i0q8k_jhf2yPKgqB1yNrA_cq4ER4Wt";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
);

let currentMonth =
localStorage.getItem("currentMonth")
|| "April-2026";

let isLoading = false;
let currentUser = null;
let currentUsername = "";

function userStorageKey(){
return `billTrackerData_${currentUsername}_${currentMonth}`;
}

function setLoginMessage(message){
const el = document.getElementById("loginMessage");
if(el) el.innerText = message || "";
}

async function loginWithUsername(){

const input =
document.getElementById("usernameInput");

const username =
input.value.trim();

if(!username){
setLoginMessage("Please enter a username.");
return;
}

const normalizedUsername =
username.toLowerCase().replace(/\\s+/g," ");

setLoginMessage("Loading...");

try{

let { data: user, error } =
await supabaseClient
.from("money_users")
.select("*")
.eq("username", normalizedUsername)
.maybeSingle();

if(error){
console.log(error);
setLoginMessage(
"Database is not ready. Please run the MoneyTracker SQL setup first."
);
return;
}

if(!user){

const result =
await supabaseClient
.from("money_users")
.insert([{
username: normalizedUsername,
display_name: username
}])
.select()
.single();

if(result.error){
console.log(result.error);
setLoginMessage(
"Could not create this username."
);
return;
}

user = result.data;
}

currentUser = user;
currentUsername = user.username;

if(user.last_month){
currentMonth = user.last_month;
}

document.getElementById("currentUserLabel").innerText =
`User: ${user.display_name || user.username}`;

sessionStorage.setItem(
"moneyTrackerUserId",
user.id
);

sessionStorage.setItem(
"moneyTrackerUsername",
user.username
);

document.getElementById(
"loginScreen"
).style.display = "none";

generateYearMonths();
await loadData();
calculateTotals();
calculateAllBreakdowns();

if(document.getElementById("billTable").children.length === 0){
addRow();
}

}catch(error){

console.log(error);
setLoginMessage("Login failed. Please try again.");

}

}

function logout(){

sessionStorage.removeItem("moneyTrackerUserId");
sessionStorage.removeItem("moneyTrackerUsername");

currentUser = null;
currentUsername = "";

document.getElementById("loginScreen").style.display = "flex";
document.getElementById("usernameInput").value = "";
setLoginMessage("");

}

async function checkLoginState(){

const userId =
sessionStorage.getItem("moneyTrackerUserId");

const username =
sessionStorage.getItem("moneyTrackerUsername");

if(!userId || !username) return false;

const { data: user, error } =
await supabaseClient
.from("money_users")
.select("*")
.eq("id", userId)
.eq("username", username)
.maybeSingle();

if(error || !user) return false;

currentUser = user;
currentUsername = user.username;

if(user.last_month){
currentMonth = user.last_month;
}

document.getElementById(
"loginScreen"
).style.display = "none";

return true;
}

function generateYearMonths(){

const select =
document.getElementById(
"monthSelect"
);

select.innerHTML = "";

const months = [

"January",
"February",
"March",
"April",
"May",
"June",
"July",
"August",
"September",
"October",
"November",
"December"

];

const startYear = 2026;
const endYear = 2035;

for(
let year = startYear;
year <= endYear;
year++
){

months.forEach(month => {

if(year === 2026 &&
(month === "January" ||
month === "February" ||
month === "March")) return;

const value =
`${month}-${year}`;

const option =
document.createElement(
"option"
);

option.value = value;

option.textContent = value;

if(value === currentMonth){

option.selected = true;

}

select.appendChild(option);

});

}

}
function previousMonth(){

const select =
document.getElementById(
"monthSelect"
);

if(select.selectedIndex > 0){

select.selectedIndex--;

switchMonth();

}

}

function nextMonth(){

const select =
document.getElementById(
"monthSelect"
);

if(
select.selectedIndex <
select.options.length - 1
){

select.selectedIndex++;

switchMonth();

}

}


async function switchMonth(){

currentMonth =
document.getElementById(
"monthSelect"
).value;

localStorage.setItem(
"currentMonth",
currentMonth
);

if(currentUsername){
localStorage.setItem(
`currentMonth_${currentUsername}`,
currentMonth
);
}

if(currentUser){
await supabaseClient
.from("money_users")
.update({ last_month: currentMonth })
.eq("id", currentUser.id);
}

document.getElementById("billTable").innerHTML = "";
document.getElementById("allBreakdowns").innerHTML = "";

if(currentUser){

await loadData();

}

calculateTotals();
calculateAllBreakdowns();

if(
document.getElementById("billTable").children.length === 0
){

addRow();

}

}

async function getMonthData(month){

const { data, error } =
await supabaseClient
.from("money_data")
.select("data")
.eq("user_id", currentUser.id)
.eq("month", month)
.maybeSingle();

if(error){
console.log(error);
alert("Database error while loading " + month + ".");
return null;
}

if(!data){
alert(`No saved data found for ${month}.`);
return null;
}

return typeof data.data === "string"
? JSON.parse(data.data)
: data.data;
}

async function copyBill(button){

if(!currentUser) return;

const row = button.closest("tr");
const inputs = row.querySelectorAll("input");
const billName = inputs[0]?.value?.trim() || "";

if(!billName){
alert("Give this bill a name first, then copy it.");
return;
}

const sourceMonth = prompt(
`Copy "${billName}" from which month?\\nExample: July-2026`
);

if(!sourceMonth) return;

const cleanMonth = sourceMonth.trim();

if(cleanMonth === currentMonth){
alert("You cannot copy from the current month.");
return;
}

const sourceData = await getMonthData(cleanMonth);
if(!sourceData) return;

const sourceBill = (sourceData.bills || []).find(bill =>
String(bill.billName || "").trim().toLowerCase() === billName.toLowerCase()
);

if(!sourceBill){
alert(`No bill named "${billName}" was found in ${cleanMonth}.`);
return;
}

inputs[0].value = sourceBill.billName || "";
inputs[1].value = sourceBill.price || "";
inputs[2].value = sourceBill.dueDate || "";

const select = row.querySelector("select");
select.value = "Unpaid";
updateStatusVisualOnly(select);

calculateTotals();
await saveData();

}

function updateStatusVisualOnly(select){

if(select.value === "Paid"){
select.classList.remove("unpaid");
select.classList.add("paid");
}else{
select.classList.remove("paid");
select.classList.add("unpaid");
}

}

async function copyBreakdown(button){

if(!currentUser) return;

const box = button.closest(".breakdown-box");
const title =
box.querySelector(".breakdown-title")?.innerText?.trim()
|| "NEW BREAKDOWN";

const sourceMonth = prompt(
`Copy "${title}" from which month?\\nExample: July-2026`
);

if(!sourceMonth) return;

const cleanMonth = sourceMonth.trim();

if(cleanMonth === currentMonth){
alert("You cannot copy from the current month.");
return;
}

const sourceData = await getMonthData(cleanMonth);
if(!sourceData) return;

const sourceBreakdown = (sourceData.breakdowns || []).find(breakdown =>
String(breakdown.title || "").trim().toLowerCase() === title.toLowerCase()
);

if(!sourceBreakdown){
alert(`No breakdown named "${title}" was found in ${cleanMonth}.`);
return;
}

const container = document.getElementById("allBreakdowns");
const newBox = document.createElement("div");
newBox.className = "breakdown-box";

newBox.innerHTML = `
<h2
class="breakdown-title"
contenteditable="true"
onkeyup="saveData()"
>${escapeHtml(sourceBreakdown.title || "NEW BREAKDOWN")}</h2>

<input
type="number"
class="breakdownMainTotal"
placeholder="Main Total"
oninput="
calculateAllBreakdowns();
saveData();
"
>

<table>
<tbody class="breakdownTable"></tbody>
</table>

<div
style="
display:flex;
gap:10px;
margin-top:15px;
"
>

<button
class="add-btn"
onclick="addBreakdownRow(this)"
>
+ ADD ITEM
</button>

<button
class="add-btn"
onclick="copyBreakdown(this)"
title="Copy this breakdown from another month"
>
📋 COPY
</button>

<button
class="delete-btn"
onclick="deleteBreakdownBox(this)"
>
DELETE BOX
</button>

</div>

<div
class="breakdown-summary"
style="margin-top:20px;"
>

<div
style="
display:flex;
justify-content:space-between;
margin-bottom:10px;
font-size:22px;
font-weight:bold;
"
>
<span>NEW TOTAL</span>
<span class="breakdownTotal">0</span>
</div>

<div
style="
display:flex;
justify-content:space-between;
font-size:22px;
font-weight:bold;
color:#86efac;
"
>
<span>ACTUAL BILL</span>
<span class="actualBreakdownBill">0</span>
</div>

</div>
`;

container.appendChild(newBox);

newBox.querySelector(".breakdownMainTotal").value =
sourceBreakdown.total || "";

(sourceBreakdown.items || []).forEach(item => {
addBreakdownRow(newBox.querySelector(".add-btn"));
const rows = newBox.querySelectorAll(".breakdownTable tr");
const lastRow = rows[rows.length - 1];
const inputs = lastRow.querySelectorAll("input");
inputs[0].value = item.price || "";
inputs[1].value = item.description || "";
});

calculateAllBreakdowns();
await saveData();

}

function escapeHtml(value){
return String(value)
.replace(/&/g, "&amp;")
.replace(/</g, "&lt;")
.replace(/>/g, "&gt;")
.replace(/"/g, "&quot;")
.replace(/'/g, "&#039;");
}

function closeImportModal(){
const modal = document.getElementById("importModal");
if(modal) modal.remove();
}

function getAvailableImportMonths(){
const select = document.getElementById("monthSelect");
if(!select) return [];
return Array.from(select.options)
.filter(option => option.value !== currentMonth)
.map(option => option.value);
}

async function performSelectiveImport(){

const sourceMonth =
document.getElementById("importSourceMonth").value;

await getMonthData(sourceMonth);

if(!sourceData) return;

const billIndexes =
Array.from(document.querySelectorAll(".import-bill:checked"))
.map(input => Number(input.value));

const billFields =
Array.from(document.querySelectorAll(".import-bill-field:checked"))
.map(input => input.value);

const breakdownIndexes =
Array.from(document.querySelectorAll(".import-breakdown:checked"))
.map(input => Number(input.value));

const breakdownFields =
Array.from(document.querySelectorAll(".import-breakdown-field:checked"))
.map(input => input.value);

if(
billIndexes.length === 0 &&
breakdownIndexes.length === 0
){
alert("Select at least one bill or breakdown.");
return;
}

if(
billIndexes.length > 0 &&
billFields.length === 0
){
alert("Select at least one bill field.");
return;
}

if(
breakdownIndexes.length > 0 &&
breakdownFields.length === 0
){
alert("Select at least one breakdown field.");
return;
}

try{

isLoading = true;

const { data: existingRow, error } =
await supabaseClient
.from("money_data")
.select("data")
.eq("user_id", currentUser.id)
.eq("month", currentMonth)
.maybeSingle();

if(error){
console.log(error);
alert("Database error while loading the current month.");
return;
}

let currentData = existingRow
? (typeof existingRow.data === "string"
? JSON.parse(existingRow.data)
: existingRow.data)
: {
title: currentMonth,
salary: "",
leftover: "",
bills: [],
breakdowns: []
};

currentData.bills =
Array.isArray(currentData.bills)
? currentData.bills
: [];

currentData.breakdowns =
Array.isArray(currentData.breakdowns)
? currentData.breakdowns
: [];

const sourceBills =
Array.isArray(sourceData.bills)
? sourceData.bills
: [];

const sourceBreakdowns =
Array.isArray(sourceData.breakdowns)
? sourceData.breakdowns
: [];

/* BILLS */
billIndexes.forEach(index => {

const sourceBill = sourceBills[index];
if(!sourceBill) return;

const sourceName =
String(sourceBill.billName || "").trim();

let targetBill =
currentData.bills.find(bill =>
String(bill.billName || "").trim().toLowerCase()
=== sourceName.toLowerCase()
);

if(!targetBill){

targetBill = {
billName: sourceBill.billName || "",
price: "",
status: "Unpaid",
dueDate: ""
};

currentData.bills.push(targetBill);

}

if(billFields.includes("billName"))
targetBill.billName = sourceBill.billName || "";

if(billFields.includes("price"))
targetBill.price = sourceBill.price || "";

if(billFields.includes("status"))
targetBill.status = sourceBill.status || "Unpaid";

if(billFields.includes("dueDate"))
targetBill.dueDate = sourceBill.dueDate || "";

});

/* BREAKDOWNS */
breakdownIndexes.forEach(index => {

const sourceBreakdown = sourceBreakdowns[index];
if(!sourceBreakdown) return;

const sourceTitle =
String(sourceBreakdown.title || "").trim();

let targetBreakdown =
currentData.breakdowns.find(breakdown =>
String(breakdown.title || "").trim().toLowerCase()
=== sourceTitle.toLowerCase()
);

if(!targetBreakdown){

targetBreakdown = {
title: sourceBreakdown.title || "NEW BREAKDOWN",
total: "",
items: []
};

currentData.breakdowns.push(targetBreakdown);

}

if(breakdownFields.includes("title"))
targetBreakdown.title =
sourceBreakdown.title || "NEW BREAKDOWN";

if(breakdownFields.includes("total"))
targetBreakdown.total =
sourceBreakdown.total || "";

/*
For breakdown items, match by description when possible.
If no match exists, create a new item.
This allows importing only price or only description without
destroying existing items.
*/
const sourceItems =
Array.isArray(sourceBreakdown.items)
? sourceBreakdown.items
: [];

targetBreakdown.items =
Array.isArray(targetBreakdown.items)
? targetBreakdown.items
: [];

sourceItems.forEach((sourceItem, itemIndex) => {

const sourceDescription =
String(sourceItem.description || "").trim();

let targetItem =
targetBreakdown.items.find(item =>
sourceDescription &&
String(item.description || "").trim().toLowerCase()
=== sourceDescription.toLowerCase()
);

if(!targetItem){
targetItem =
targetBreakdown.items[itemIndex];
}

if(!targetItem){

targetItem = {
price: "",
description: ""
};

targetBreakdown.items.push(targetItem);

}

if(breakdownFields.includes("itemPrice"))
targetItem.price = sourceItem.price || "";

if(breakdownFields.includes("description"))
targetItem.description =
sourceItem.description || "";

});

});

/* Save the merged current month without changing salary/leftover/title. */
const { error: saveError } =
await supabaseClient
.from("money_data")
.upsert([
{
user_id: currentUser.id,
month: currentMonth,
data: currentData
}
],
{ onConflict: "user_id,month" });

if(saveError){
console.log(saveError);
alert("Import could not be saved.");
return;
}

localStorage.setItem(
userStorageKey(),
JSON.stringify(currentData)
);

closeImportModal();

await loadData();
calculateTotals();
calculateAllBreakdowns();

if(document.getElementById("billTable").children.length === 0){
addRow();
}

alert(`Selected information imported from ${sourceMonth}.`);

}catch(error){

console.log(error);
alert("Import failed.");

}finally{

isLoading = false;

}

}



function updateStatus(select){

if(select.value === "Paid"){

select.classList.remove("unpaid");
select.classList.add("paid");

}else{

select.classList.remove("paid");
select.classList.add("unpaid");

}

saveData();

}

function resetStatuses(){

if(
!confirm(
"Reset all statuses to Unpaid?"
)
) return;

document.querySelectorAll(
".status-select"
).forEach(select => {

select.value = "Unpaid";

select.classList.remove(
"paid"
);

select.classList.add(
"unpaid"
);

});

saveData();

alert(
"All statuses reset."
);

}

function calculateTotals(){

let totalBill = 0;

document.querySelectorAll(".price-input")
.forEach(input => {

totalBill +=
Number(input.value) || 0;

});

const salary =
Number(
document.getElementById("salary").value
) || 0;

const leftover =
Number(
document.getElementById("leftover").value
) || 0;

const totalMoney =
salary + leftover;

const moneyLeft =
totalMoney - totalBill;

document.getElementById(
"totalBill"
).innerText =
totalBill.toLocaleString();

document.getElementById(
"totalMoney"
).innerText =
totalMoney.toLocaleString();

document.getElementById(
"moneyLeft"
).innerText =
moneyLeft.toLocaleString();

}

function calculateAllBreakdowns(){

const boxes =
document.querySelectorAll(
".breakdown-box"
);

boxes.forEach(box => {

let total = 0;

box.querySelectorAll(
".breakdown-price"
).forEach(input => {

total +=
Number(input.value) || 0;

});

const mainTotal =
Number(
box.querySelector(
".breakdownMainTotal"
).value
) || 0;

box.querySelector(
".breakdownTotal"
).innerText =
total.toLocaleString();

box.querySelector(
".actualBreakdownBill"
).innerText =
(
mainTotal - total
).toLocaleString();

});

}

).remove();

}

function setSaveStatus(text){
const el = document.getElementById("saveStatus");
if(el) el.innerText = text || "";
}

let saveStatusTimer = null;

function showSaving(){
clearTimeout(saveStatusTimer);
setSaveStatus("Saving...");
}

function showSaved(){
clearTimeout(saveStatusTimer);
setSaveStatus("✓ Saved");
saveStatusTimer = setTimeout(() => {
setSaveStatus("");
}, 2500);
}

function showSaveError(){
clearTimeout(saveStatusTimer);
setSaveStatus("⚠ Save failed");
}

async function saveData(){
if(isLoading) return;
if(!currentUser) return;

showSaving();

const data = {

title:
document.querySelector(".title").innerText,

salary:
document.getElementById("salary").value,

leftover:
document.getElementById("leftover").value,

bills: [],

breakdowns: []

};

document.querySelectorAll(
"#billTable tr"
).forEach(row => {

const inputs =
row.querySelectorAll("input");

const select =
row.querySelector("select");

data.bills.push({

billName:
inputs[0].value,

price:
inputs[1].value,

dueDate:
inputs[2].value,

status:
select.value

});

});

document.querySelectorAll(
".breakdown-box"
).forEach(box => {

const breakdown = {

title:
box.querySelector(
".breakdown-title"
).innerText,

total:
box.querySelector(
".breakdownMainTotal"
).value,

items: []

};

box.querySelectorAll(
".breakdownTable tr"
).forEach(row => {

const inputs =
row.querySelectorAll("input");

breakdown.items.push({

price:
inputs[0].value,

description:
inputs[1].value

});

});

data.breakdowns.push(
breakdown
);

});

localStorage.setItem(
"billTrackerData",
JSON.stringify(data)
);

try{

const { error } =
await supabaseClient
.from("money_data")
.upsert([
{
user_id: currentUser.id,
month: currentMonth,
data: JSON.stringify(data)
}
], { onConflict: "user_id,month" });

if(error){
console.log(error);
showSaveError();
return;
}

showSaved();

}catch(error){

console.log(error);
showSaveError();

}

}

async function loadData(){

if(!currentUser) return;

isLoading = true;

let saved =
localStorage.getItem(userStorageKey());

try{

const { data: cloudData, error } =
await supabaseClient
.from("money_data")
.select("*")
.eq("user_id", currentUser.id)
.eq("month", currentMonth)
.maybeSingle();

if(error){
console.log(error);
}

if(cloudData?.data){

saved = cloudData.data;

localStorage.setItem(
userStorageKey(),
saved
);

}

}catch(error){

console.log(error);

}

if(!saved){

isLoading = false;
return;

}

const data =
typeof saved === "string"
? JSON.parse(saved)
: saved;

document.querySelector(
".title"
).innerText =
data.title || "BILLS";

document.getElementById(
"salary"
).value =
data.salary || "";

document.getElementById(
"leftover"
).value =
data.leftover || "";

document.getElementById(
"billTable"
).innerHTML = "";

(data.bills || []).forEach(bill => {

addRow();

const rows =
document.querySelectorAll(
"#billTable tr"
);

const lastRow =
rows[rows.length - 1];

const inputs =
lastRow.querySelectorAll("input");

inputs[0].value =
bill.billName || "";

inputs[1].value =
bill.price || "";

inputs[2].value =
bill.dueDate || "";

const select =
lastRow.querySelector("select");

select.value =
bill.status || "Unpaid";

updateStatus(select);

});

document.getElementById(
"allBreakdowns"
).innerHTML = "";

(data.breakdowns || []).forEach(
breakdown => {

addBreakdownBox();

const boxes =
document.querySelectorAll(
".breakdown-box"
);

const latestBox =
boxes[boxes.length - 1];

latestBox.querySelector(
".breakdown-title"
).innerText =
breakdown.title || "NEW BREAKDOWN";

latestBox.querySelector(
".breakdownMainTotal"
).value =
breakdown.total || "";

latestBox.querySelector(
".breakdownTable"
).innerHTML = "";

(breakdown.items || []).forEach(
item => {

addBreakdownRow(
latestBox.querySelector(".add-btn")
);

const rows =
latestBox.querySelectorAll(
".breakdownTable tr"
);

const lastRow =
rows[rows.length - 1];

const inputs =
lastRow.querySelectorAll("input");

inputs[0].value =
item.price || "";

inputs[1].value =
item.description || "";

});

});

calculateTotals();
calculateAllBreakdowns();
isLoading = false;

}

async function manualSave(){

await saveData();

}

async function clearAllData(){

if(!currentUser) return;

if(
!confirm(
"Delete all saved MoneyTracker data for this username?"
)
) return;

try{

const { error } =
await supabaseClient
.from("money_data")
.delete()
.eq("user_id", currentUser.id);

if(error){
console.log(error);
alert("Could not clear cloud data.");
return;
}

Object.keys(localStorage)
.filter(key =>
key.startsWith(`billTrackerData_${currentUsername}_`)
)
.forEach(key =>
localStorage.removeItem(key)
);

localStorage.removeItem("billTrackerData");

location.reload();

}catch(error){

console.log(error);
alert("Clear failed.");

}

}

event => {

loginWithUsername();
}
}
);

calculateAllBreakdowns();

if(
document.getElementById("billTable").children.length === 0
){

addRow();

}

}else{

document.getElementById(
"loginScreen"
).style.display = "flex";

}

};
