padding:0;

body{

.title{

.salary-row{

.table-input,

.status-select{

padding:10px;

}

.paid{

}

.unpaid{

}

.summary{
margin-top:30px;
margin-left:auto;
width:400px;
background:#2b213d;
border:1px solid #c084fc;

background:#2b213d;
border:1px solid #c084fc;

.breakdown-title{
font-size:28px;
margin-bottom:20px;
}

.breakdown-price,

width:100%;
padding:10px;
border:none;
border-radius:10px;
background:#1b1427;
color:white;
}

.loan-box{
margin-top:30px;
background:#2b213d;
border:1px solid #c084fc;
border-radius:18px;
padding:20px;
}

.loan-title{
font-size:28px;
margin-bottom:18px;
color:#f3e8ff;
}

.loan-field-label{
display:block;
font-size:13px;
font-weight:bold;
letter-spacing:.5px;
color:#d8b4fe;
margin:12px 0 7px;
}

.loan-amount,
.loan-bank,
.loan-custom-input,
.loan-custom-select{
width:100%;
padding:12px;
border:1px solid #4c3566;
border-radius:10px;
background:#1b1427;
color:white;
outline:none;
font-size:16px;
}

.loan-custom-panel{
display:none;
margin-top:16px;
padding:16px;
border:1px solid #5b4277;
border-radius:14px;
background:#21172f;
}

.loan-custom-panel.show{
display:block;
}

.loan-custom-grid{
display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
gap:12px;
}

.loan-custom-grid .full{
grid-column:1 / -1;
}

.loan-custom-help{
font-size:12px;
line-height:1.45;
color:#c4b5fd;
opacity:.85;
margin-top:8px;
}

.loan-bank-name{
font-size:24px;
font-weight:bold;
margin-top:22px;
color:#d8b4fe;
}

.loan-rate-note{
margin:7px 0 15px;
font-size:13px;
color:#c4b5fd;
opacity:.9;
}

.loan-results-table{
margin-top:10px;
}

.loan-results-table th,
.loan-results-table td{
text-align:right;
}

.loan-results-table th:first-child,
.loan-results-table td:first-child{
text-align:left;
}

.loan-empty{
padding:18px 12px;
text-align:center;
opacity:.7;
}

.loan-actions{
display:flex;
gap:10px;
margin-top:15px;
flex-wrap:wrap;
}

@media (max-width:700px){
body{padding:12px;}
.container{padding:15px;}
.title{font-size:42px;}
.salary-box{min-width:100%;}
.summary{width:100%;}
.loan-results-table{font-size:13px;}
.loan-results-table th,
.loan-results-table td{padding:9px 6px;}
.loan-custom-grid{grid-template-columns:1fr;}
.loan-custom-grid .full{grid-column:auto;}
}

<script>

// MoneyTracker build: Leif-only loan calculator (RCBC UnliPay / UB EasyCash / UB EasyConvert / SSS Emergency Loan / Custom Rate)

const SUPABASE_URL =
"https://fvzrphhacxchvicekluj.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_6i0q8k_jhf2yPKgqB1yNrA_cq4ER4Wt";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
);

let currentMonth =
localStorage.getItem("currentMonth")
|| "April-2026";

let isLoading = false;
let currentUser = null;
let currentUsername = "";

const RCBC_LOAN_TERMS = [3, 6, 9, 12, 18, 24, 36];
const RCBC_ADD_ON_RATE = 0.01;
const UB_LOAN_TERMS = [6, 12, 18, 24, 36, 48, 60];
const UB_ADD_ON_RATE = 0.0049;
const UB_PROCESSING_FEE = 1000;
const UB_EASYCONVERT_TERMS = [3, 6, 12, 24];
const UB_EASYCONVERT_CMFR = 0.01;
const UB_EASYCONVERT_PROCESSING_FEE = 350;
const SSS_EMERGENCY_ANNUAL_RATE = 0.07;
const SSS_EMERGENCY_PAYMENT_MONTHS = 24;
const SSS_EMERGENCY_MORATORIUM_MONTHS = 6;

function isLeifUser(){
return String(currentUsername || "").trim().toLowerCase() === "leif";
}

function updateLeifOnlyUI(){
const button = document.getElementById("addLoanBtn");
if(button){
button.style.display = isLeifUser() ? "inline-block" : "none";
}

if(!isLeifUser()){
const loanContainer = document.getElementById("allLoans");
if(loanContainer) loanContainer.innerHTML = "";
}
}

function formatPeso(value){
return Number(value || 0).toLocaleString("en-PH", {
minimumFractionDigits: 2,
maximumFractionDigits: 2
});
}

function getRCBCProcessingFee(amount){
if(amount < 10000) return 100;
if(amount < 30000) return 200;
return amount * 0.01;
}

function parseCustomTerms(value){
return Array.from(new Set(
String(value || "")
.split(/[,\s]+/)
.map(v => Math.round(Number(v)))
.filter(v => Number.isFinite(v) && v > 0 && v <= 120)
)).sort((a,b) => a-b);
}

function getCustomLoanOptions(amount, custom = {}){
const terms = parseCustomTerms(custom.terms);
if(!terms.length) return [];

const ratePercent = Math.max(0, Number(custom.rate) || 0);
const rate = ratePercent / 100;
const method = custom.method || "monthly_addon";
const fixedFee = Math.max(0, Number(custom.fixedFee) || 0);
const percentFee = Math.max(0, Number(custom.percentFee) || 0);
const fee = fixedFee + (amount * (percentFee / 100));

return terms.map(term => {
let monthly = 0;
let installmentTotal = amount;

if(method === "annual_addon"){
const interest = amount * rate * (term / 12);
installmentTotal = amount + interest;
monthly = installmentTotal / term;
}else if(method === "monthly_diminishing"){
const r = rate;
monthly = r > 0
? amount * r / (1 - Math.pow(1 + r, -term))
: amount / term;
installmentTotal = monthly * term;
}else if(method === "annual_diminishing"){
const r = rate / 12;
monthly = r > 0
? amount * r / (1 - Math.pow(1 + r, -term))
: amount / term;
installmentTotal = monthly * term;
}else if(method === "flat_once"){
const interest = amount * rate;
installmentTotal = amount + interest;
monthly = installmentTotal / term;
}else{
// Monthly add-on / flat monthly rate.
const interest = amount * rate * term;
installmentTotal = amount + interest;
monthly = installmentTotal / term;
}

return {
term,
monthly,
fee,
total: installmentTotal + fee
};
});
}

function getLoanOptions(bank, amount, custom = {}){
if(!amount || amount <= 0) return [];

if(bank === "CUSTOM"){
return getCustomLoanOptions(amount, custom);
}

if(bank === "UB"){
return UB_LOAN_TERMS.map(term => {
const monthly = (amount / term) + (amount * UB_ADD_ON_RATE);
const installmentTotal = monthly * term;
return {
term,
monthly,
fee: UB_PROCESSING_FEE,
total: installmentTotal + UB_PROCESSING_FEE
};
});
}

if(bank === "UB_EASYCONVERT"){
return UB_EASYCONVERT_TERMS.map(term => {
const monthly = (amount / term) + (amount * UB_EASYCONVERT_CMFR);
const installmentTotal = monthly * term;
return {
term,
monthly,
fee: UB_EASYCONVERT_PROCESSING_FEE,
total: installmentTotal + UB_EASYCONVERT_PROCESSING_FEE
};
});
}

if(bank === "SSS"){
/*
SSS Emergency Loan estimate:
- 7% p.a. on diminishing principal balance
- 6-month payment moratorium
- 24 equal monthly amortizations afterward
- moratorium interest is spread equally across the 24 payments and does not itself earn interest
Exact SSS figures may vary slightly because SSS applies pro-rated daily interest based on the actual loan date.
*/
const monthlyRate = SSS_EMERGENCY_ANNUAL_RATE / 12;
const n = SSS_EMERGENCY_PAYMENT_MONTHS;
const principalAmortization =
amount * monthlyRate / (1 - Math.pow(1 + monthlyRate, -n));
const moratoriumInterest =
amount * SSS_EMERGENCY_ANNUAL_RATE * (SSS_EMERGENCY_MORATORIUM_MONTHS / 12);
const monthly = principalAmortization + (moratoriumInterest / n);
return [{
term: n,
monthly,
fee: 0,
total: monthly * n
}];
}

return RCBC_LOAN_TERMS.map(term => {
if(term === 3){
const fee = getRCBCProcessingFee(amount);
return {
term,
monthly: amount / 3,
fee,
total: amount + fee
};
}

const monthly = (amount / term) + (amount * RCBC_ADD_ON_RATE);
return {
term,
monthly,
fee: 0,
total: monthly * term
};
});
}

function updateLoanBox(box){
if(!box || !isLeifUser()) return;

const amount = Number(box.querySelector(".loan-amount")?.value) || 0;
const bank = box.querySelector(".loan-bank")?.value || "RCBC";
const bankName = box.querySelector(".loan-bank-name");
const note = box.querySelector(".loan-rate-note");
const results = box.querySelector(".loan-results");
const customPanel = box.querySelector(".loan-custom-panel");

if(customPanel){
customPanel.classList.toggle("show", bank === "CUSTOM");
}

const custom = {
name: box.querySelector(".loan-custom-name")?.value?.trim() || "Custom Rate",
rate: box.querySelector(".loan-custom-rate")?.value || "",
method: box.querySelector(".loan-custom-method")?.value || "monthly_addon",
terms: box.querySelector(".loan-custom-terms")?.value || "",
fixedFee: box.querySelector(".loan-custom-fixed-fee")?.value || "",
percentFee: box.querySelector(".loan-custom-percent-fee")?.value || ""
};

if(bankName){
bankName.innerText = bank === "UB"
? "UB EasyCash"
: bank === "UB_EASYCONVERT"
? "UB EasyConvert"
: bank === "SSS"
? "SSS Emergency Loan"
: bank === "CUSTOM"
? (custom.name || "Custom Rate")
: "RCBC UnliPay";
}

if(note){
if(bank === "UB"){
note.innerText = "0.49% monthly add-on • ₱1,000 processing fee billed separately";
}else if(bank === "UB_EASYCONVERT"){
note.innerText = "1.00% converted monthly factor rate (published example) • ₱350 processing fee default • 3 / 6 / 12 / 24 months • initial interest from approval to statement date is not included in this estimate";
}else if(bank === "SSS"){
note.innerText = "7% per year on diminishing balance • 6-month payment moratorium + 24 monthly payments • estimated amount; SSS may vary slightly due to daily pro-rated interest";
}else if(bank === "CUSTOM"){
const methodLabels = {
monthly_addon: "monthly add-on",
annual_addon: "annual add-on",
monthly_diminishing: "monthly diminishing / amortized",
annual_diminishing: "annual diminishing / amortized",
flat_once: "one-time flat rate"
};
const rateText = custom.rate === "" ? "Enter a rate" : `${Number(custom.rate) || 0}% ${methodLabels[custom.method] || "monthly add-on"}`;
note.innerText = `${rateText} • custom fees are included in TOTAL but shown separately from MONTHLY`;
}else{
note.innerText = "3 months: 0% installment interest + processing fee • 6–36 months: 1% monthly add-on";
}
}

if(!results) return;

if(amount <= 0){
results.innerHTML = `
<tr>
<td colspan="4" class="loan-empty">Enter an amount above to see the installment options.</td>
</tr>
`;
return;
}

if(bank === "CUSTOM" && !parseCustomTerms(custom.terms).length){
results.innerHTML = `
<tr>
<td colspan="4" class="loan-empty">Enter at least one custom term, such as 3, 6, 12.</td>
</tr>
`;
return;
}

const options = getLoanOptions(bank, amount, custom);
results.innerHTML = options.map(option => `
<tr>
<td>${option.term} MOS</td>
<td>₱${formatPeso(option.monthly)}</td>
<td>₱${formatPeso(option.total)}</td>
<td>${option.fee ? `₱${formatPeso(option.fee)}` : "—"}</td>
</tr>
`).join("");
}

function addLoanBox(savedLoan = null){
if(!isLeifUser()) return;

const container = document.getElementById("allLoans");
if(!container) return;

const box = document.createElement("div");
box.className = "loan-box";
box.innerHTML = `
<h2 class="loan-title">LOAN CALCULATOR</h2>

<input
class="loan-amount"
type="number"
min="0"
step="0.01"
placeholder="Enter amount"
oninput="updateLoanBox(this.closest('.loan-box')); saveData();"
>

<label class="loan-field-label">BANK / LOAN TYPE</label>
<select
class="loan-bank"
onchange="updateLoanBox(this.closest('.loan-box')); saveData();"
>
<option value="RCBC">RCBC UnliPay</option>

<option value="UB_EASYCONVERT">UB EasyConvert</option>

<option value="CUSTOM">CUSTOM RATE / OTHER LOAN</option>
</select>

<div class="loan-custom-panel">
<div class="loan-custom-grid">
<div class="full">
<label class="loan-field-label">CUSTOM LOAN / BANK NAME</label>
<input
class="loan-custom-input loan-custom-name"
placeholder="Example: Shopee SLoan"
oninput="updateLoanBox(this.closest('.loan-box')); saveData();"
>
</div>

<div>
<label class="loan-field-label">INTEREST RATE (%)</label>
<input
class="loan-custom-input loan-custom-rate"
type="number"
min="0"

oninput="updateLoanBox(this.closest('.loan-box')); saveData();"
>
</div>

<div>

<select
class="loan-custom-select loan-custom-method"
onchange="updateLoanBox(this.closest('.loan-box')); saveData();"
>
<option value="monthly_addon">Monthly add-on</option>
<option value="annual_addon">Annual add-on</option>
<option value="monthly_diminishing">Monthly diminishing / amortized</option>
<option value="annual_diminishing">Annual diminishing / amortized</option>
<option value="flat_once">One-time flat rate</option>
</select>
</div>

<div class="full">
<label class="loan-field-label">TERM(S) IN MONTHS</label>

</div>

<div>

<input

oninput="updateLoanBox(this.closest('.loan-box')); saveData();"
>
</div>

<div>
<label class="loan-field-label">PROCESSING FEE (%)</label>
<input
class="loan-custom-input loan-custom-percent-fee"
type="number"
min="0"
step="0.0001"
placeholder="0"
oninput="updateLoanBox(this.closest('.loan-box')); saveData();"
>
</div>
</div>

<div class="loan-custom-help">
Monthly add-on is useful when a lender quotes a monthly rate. Diminishing / amortized uses the remaining-balance formula. Use the rate type shown in the lender's actual offer for the closest estimate.
</div>
</div>

<div class="loan-bank-name">RCBC UnliPay</div>
<div class="loan-rate-note"></div>

<table class="loan-results-table">
<thead>
<tr>
<th>TERM</th>
<th>MONTHLY</th>
<th>TOTAL</th>
<th>FEE</th>
</tr>
</thead>
<tbody class="loan-results"></tbody>
</table>

<div class="loan-actions">
<button class="delete-btn" onclick="deleteLoanBox(this)">DELETE LOAN</button>

`;

container.appendChild(box);

if(savedLoan){
box.querySelector(".loan-amount").value = savedLoan.amount ?? "";
box.querySelector(".loan-bank").value = ["RCBC", "UB", "UB_EASYCONVERT", "SSS", "CUSTOM"].includes(savedLoan.bank)

: "RCBC";
box.querySelector(".loan-custom-name").value = savedLoan.customName ?? "";

document.getElementById(
"monthSelect"
);

"February",
"March",
"April",
"May",
"June",
"July",
"August",
"September",
"October",
"November",
"December"

];

const startYear = 2026;
const endYear = 2035;

for(

year <= endYear;
year++
){

async function performSelectiveImport(){

const sourceMonth =
document.getElementById("importSourceMonth").value;

const sourceData =
await getMonthData(sourceMonth);

if(!sourceData) return;

const billIndexes =
Array.from(document.querySelectorAll(".import-bill:checked"))
.map(input => Number(input.value));

const billFields =
Array.from(document.querySelectorAll(".import-bill-field:checked"))
.map(input => input.value);

const breakdownIndexes =
Array.from(document.querySelectorAll(".import-breakdown:checked"))
.map(input => Number(input.value));

const breakdownFields =
Array.from(document.querySelectorAll(".import-breakdown-field:checked"))
.map(input => input.value);

if(
billIndexes.length === 0 &&
breakdownIndexes.length === 0
){
alert("Select at least one bill or breakdown.");
return;
}

if(
billIndexes.length > 0 &&
billFields.length === 0
){
alert("Select at least one bill field.");
return;
}

if(
breakdownIndexes.length > 0 &&
breakdownFields.length === 0
){
alert("Select at least one breakdown field.");
return;
}

try{

isLoading = true;

const { data: existingRow, error } =
await supabaseClient
.from("money_data")
.select("data")
.eq("user_id", currentUser.id)
.eq("month", currentMonth)
.maybeSingle();

if(error){
console.log(error);
alert("Database error while loading the current month.");
return;
}

let currentData = existingRow
? (typeof existingRow.data === "string"
? JSON.parse(existingRow.data)
: existingRow.data)
: {
title: currentMonth,
salary: "",
leftover: "",
bills: [],
breakdowns: []
};

currentData.bills =
Array.isArray(currentData.bills)
? currentData.bills
: [];

currentData.breakdowns =
Array.isArray(currentData.breakdowns)
? currentData.breakdowns
: [];

const sourceBills =
Array.isArray(sourceData.bills)
? sourceData.bills
: [];

const sourceBreakdowns =
Array.isArray(sourceData.breakdowns)
? sourceData.breakdowns
: [];

/* BILLS */
billIndexes.forEach(index => {

const sourceBill = sourceBills[index];
if(!sourceBill) return;

const sourceName =
String(sourceBill.billName || "").trim();

let targetBill =
currentData.bills.find(bill =>
String(bill.billName || "").trim().toLowerCase()
=== sourceName.toLowerCase()
);

if(!targetBill){

targetBill = {
billName: sourceBill.billName || "",
price: "",
status: "Unpaid",
dueDate: ""
};

currentData.bills.push(targetBill);

}

if(billFields.includes("billName"))
targetBill.billName = sourceBill.billName || "";

if(billFields.includes("price"))
targetBill.price = sourceBill.price || "";

if(billFields.includes("status"))
targetBill.status = sourceBill.status || "Unpaid";

if(billFields.includes("dueDate"))
targetBill.dueDate = sourceBill.dueDate || "";

});

/* BREAKDOWNS */
breakdownIndexes.forEach(index => {

const sourceBreakdown = sourceBreakdowns[index];
if(!sourceBreakdown) return;

const sourceTitle =
String(sourceBreakdown.title || "").trim();

let targetBreakdown =
currentData.breakdowns.find(breakdown =>
String(breakdown.title || "").trim().toLowerCase()
=== sourceTitle.toLowerCase()
);

if(!targetBreakdown){

targetBreakdown = {
title: sourceBreakdown.title || "NEW BREAKDOWN",
total: "",
items: []
};

currentData.breakdowns.push(targetBreakdown);

}

if(breakdownFields.includes("title"))
targetBreakdown.title =
sourceBreakdown.title || "NEW BREAKDOWN";

if(breakdownFields.includes("total"))
targetBreakdown.total =
sourceBreakdown.total || "";

/*
For breakdown items, match by description when possible.
If no match exists, create a new item.
This allows importing only price or only description without
destroying existing items.
*/
const sourceItems =
Array.isArray(sourceBreakdown.items)
? sourceBreakdown.items
: [];

targetBreakdown.items =
Array.isArray(targetBreakdown.items)
? targetBreakdown.items
: [];

sourceItems.forEach((sourceItem, itemIndex) => {

const sourceDescription =
String(sourceItem.description || "").trim();

let targetItem =
targetBreakdown.items.find(item =>
sourceDescription &&
String(item.description || "").trim().toLowerCase()
=== sourceDescription.toLowerCase()
);

if(!targetItem){
targetItem =
targetBreakdown.items[itemIndex];
}

if(!targetItem){

targetItem = {
price: "",
description: ""
};

targetBreakdown.items.push(targetItem);

}

if(breakdownFields.includes("itemPrice"))
targetItem.price = sourceItem.price || "";

if(breakdownFields.includes("description"))
targetItem.description =
sourceItem.description || "";

});

});

/* Save the merged current month without changing salary/leftover/title. */
const { error: saveError } =
await supabaseClient
.from("money_data")
.upsert([
{
user_id: currentUser.id,
month: currentMonth,
data: currentData
}
],
{ onConflict: "user_id,month" });

if(saveError){
console.log(saveError);
alert("Import could not be saved.");
return;
}

localStorage.setItem(
userStorageKey(),
JSON.stringify(currentData)
);

closeImportModal();

await loadData();
calculateTotals();
calculateAllBreakdowns();

if(document.getElementById("billTable").children.length === 0){
addRow();
}

alert(`Selected information imported from ${sourceMonth}.`);

}catch(error){

console.log(error);
alert("Import failed.");

}finally{

isLoading = false;

}

}

function calculateTotals(){

let totalBill = 0;

document.querySelectorAll(".price-input")
.forEach(input => {

totalBill +=
Number(input.value) || 0;

});

const salary =
Number(
document.getElementById("salary").value
) || 0;

const leftover =
Number(
document.getElementById("leftover").value
) || 0;

const totalMoney =
salary + leftover;

const moneyLeft =
totalMoney - totalBill;

document.getElementById(
"totalBill"
).innerText =
totalBill.toLocaleString();

document.getElementById(
"totalMoney"
).innerText =
totalMoney.toLocaleString();

document.getElementById(
"moneyLeft"
).innerText =
moneyLeft.toLocaleString();

}

function calculateAllBreakdowns(){

const boxes =
document.querySelectorAll(
".breakdown-box"
);

boxes.forEach(box => {

let total = 0;

box.querySelectorAll(
".breakdown-price"
).forEach(input => {

total +=
Number(input.value) || 0;

});

const mainTotal =
Number(
box.querySelector(
".breakdownMainTotal"
).value
) || 0;

box.querySelector(
".breakdownTotal"
).innerText =
total.toLocaleString();

box.querySelector(
".actualBreakdownBill"
).innerText =
(
mainTotal - total
).toLocaleString();

});

}

function setSaveStatus(text){
const el = document.getElementById("saveStatus");
if(el) el.innerText = text || "";
}

let saveStatusTimer = null;

function showSaving(){
clearTimeout(saveStatusTimer);
setSaveStatus("Saving...");
}

function showSaved(){
clearTimeout(saveStatusTimer);
setSaveStatus("✓ Saved");
saveStatusTimer = setTimeout(() => {
setSaveStatus("");
}, 2500);
}

function showSaveError(){
clearTimeout(saveStatusTimer);
setSaveStatus("⚠ Save failed");
}

async function saveData(){
if(isLoading) return;
if(!currentUser) return;

showSaving();

const data = {

title:
document.querySelector(".title").innerText,

salary:
document.getElementById("salary").value,

leftover:
document.getElementById("leftover").value,

bills: [],

breakdowns: [],

loans: []

};

document.querySelectorAll(
"#billTable tr"
).forEach(row => {

const inputs =
row.querySelectorAll("input");

const select =
row.querySelector("select");

data.bills.push({

billName:
inputs[0].value,

price:
inputs[1].value,

dueDate:
inputs[2].value,

status:
select.value

});

});

document.querySelectorAll(
".breakdown-box"
).forEach(box => {

const breakdown = {

title:
box.querySelector(
".breakdown-title"
).innerText,

total:
box.querySelector(
".breakdownMainTotal"
).value,

items: []

};

box.querySelectorAll(
".breakdownTable tr"
).forEach(row => {

const inputs =
row.querySelectorAll("input");

breakdown.items.push({

price:
inputs[0].value,

description:
inputs[1].value

});

});

data.breakdowns.push(
breakdown
);

});

if(isLeifUser()){
document.querySelectorAll(".loan-box").forEach(box => {
data.loans.push({
amount: box.querySelector(".loan-amount")?.value || "",
bank: ["RCBC", "UB", "UB_EASYCONVERT", "SSS", "CUSTOM"].includes(box.querySelector(".loan-bank")?.value)
? box.querySelector(".loan-bank").value
: "RCBC",
customName: box.querySelector(".loan-custom-name")?.value || "",
customRate: box.querySelector(".loan-custom-rate")?.value || "",
customMethod: box.querySelector(".loan-custom-method")?.value || "monthly_addon",
customTerms: box.querySelector(".loan-custom-terms")?.value || "",
customFixedFee: box.querySelector(".loan-custom-fixed-fee")?.value || "",
customPercentFee: box.querySelector(".loan-custom-percent-fee")?.value || ""
});
});
}

localStorage.setItem(
userStorageKey(),
JSON.stringify(data)
);

try{

const { error } =
await supabaseClient
.from("money_data")
.upsert([
{
user_id: currentUser.id,
month: currentMonth,
data: JSON.stringify(data)
}
], { onConflict: "user_id,month" });

if(error){
console.log(error);
showSaveError();
return;
}

showSaved();

}catch(error){

console.log(error);
showSaveError();

}

}

async function loadData(){

if(!currentUser) return;

isLoading = true;

// Clear the previous view first so switching users/months never leaves stale data visible.
document.querySelector(".title").innerText = "BILLS";
document.getElementById("salary").value = "";
document.getElementById("leftover").value = "";
document.getElementById("billTable").innerHTML = "";
document.getElementById("allBreakdowns").innerHTML = "";
document.getElementById("allLoans").innerHTML = "";

let saved =
localStorage.getItem(userStorageKey());

try{

const { data: cloudData, error } =
await supabaseClient
.from("money_data")
.select("*")
.eq("user_id", currentUser.id)
.eq("month", currentMonth)
.maybeSingle();

if(error){
console.log(error);
}

if(cloudData?.data){

saved = cloudData.data;

localStorage.setItem(
userStorageKey(),
saved
);

}

}catch(error){

console.log(error);

}

if(!saved){

calculateTotals();
calculateAllBreakdowns();
isLoading = false;
return;

}

const data =
typeof saved === "string"
? JSON.parse(saved)
: saved;

document.querySelector(
".title"
).innerText =
data.title || "BILLS";

document.getElementById(
"salary"
).value =
data.salary || "";

document.getElementById(
"leftover"
).value =
data.leftover || "";

document.getElementById(
"billTable"
).innerHTML = "";

(data.bills || []).forEach(bill => {

addRow();

const rows =
document.querySelectorAll(
"#billTable tr"
);

const lastRow =
rows[rows.length - 1];

const inputs =
lastRow.querySelectorAll("input");

inputs[0].value =
bill.billName || "";

inputs[1].value =
bill.price || "";

inputs[2].value =
bill.dueDate || "";

const select =
lastRow.querySelector("select");

select.value =
bill.status || "Unpaid";

updateStatus(select);

});

document.getElementById(
"allBreakdowns"
).innerHTML = "";

(data.breakdowns || []).forEach(
breakdown => {

addBreakdownBox();

const boxes =
document.querySelectorAll(
".breakdown-box"
);

const latestBox =
boxes[boxes.length - 1];

latestBox.querySelector(
".breakdown-title"
).innerText =
breakdown.title || "NEW BREAKDOWN";

latestBox.querySelector(
".breakdownMainTotal"
).value =
breakdown.total || "";

latestBox.querySelector(
".breakdownTable"
).innerHTML = "";

(breakdown.items || []).forEach(
item => {

addBreakdownRow(
latestBox.querySelector(".add-btn")
);

const rows =
latestBox.querySelectorAll(
".breakdownTable tr"
);

const lastRow =
rows[rows.length - 1];

const inputs =
lastRow.querySelectorAll("input");

inputs[0].value =
item.price || "";

inputs[1].value =
item.description || "";

});

});

if(isLeifUser()){
(data.loans || []).forEach(loan => {
addLoanBox(loan);
});
}

calculateTotals();
calculateAllBreakdowns();
isLoading = false;

}

await saveData();

}

async function clearAllData(){

if(!currentUser) return;

if(
!confirm(
`Delete all saved MoneyTracker data for ${currentMonth}?\n\nOnly ${currentMonth} will be cleared. Your other months will remain untouched.`
)
) return;

try{

const { error } =
await supabaseClient
.from("money_data")
.delete()
.eq("user_id", currentUser.id)
.eq("month", currentMonth);

if(error){
console.log(error);
alert(`Could not clear ${currentMonth}.`);
return;
}

// Remove only the currently selected month's local cache.
localStorage.removeItem(userStorageKey());

location.reload();

}catch(error){

console.log(error);
alert("Clear failed.");

}

}
